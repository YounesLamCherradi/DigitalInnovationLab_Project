name: digital-innovation-lab

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_schema.sql:/docker-init/postgres_schema.sql:ro
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-initialize.sh:ro
      - ${SEED_DIR:-./deploy/seed}:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  media-init:
    image: alpine:3.22
    restart: "no"
    environment:
      RESTORE_MEDIA: ${RESTORE_MEDIA:-false}
    volumes:
      - uploads_data:/target/uploads
      - private_data:/target/private
      - ${SEED_DIR:-./deploy/seed}:/seed:ro
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$$RESTORE_MEDIA" = "true" ] && [ -f /seed/media.tar.gz ]; then
          rm -rf /work && mkdir -p /work
          tar -xzf /seed/media.tar.gz -C /work
          if [ -d /work/uploads ]; then cp -a /work/uploads/. /target/uploads/; fi
          if [ -d /work/private ]; then cp -a /work/private/. /target/private/; fi
          echo "Media restore completed."
        else
          echo "No media backup requested; keeping persistent media volumes."
        fi
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      NODE_ENV: production
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      RESUME_DIR: /app/private/resumes
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
      - private_data:/app/private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  uploads_data:
  private_data:
